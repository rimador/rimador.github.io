name: Fer commit i pujar
description: >-
  El bloc de git que hi havia copiat literalment a cada pas de cada workflow:
  identificar-se com el bot, afegir, comitejar només si hi ha res de nou i
  pujar-ho a main. Eren vuit còpies del mateix, i tot retoc s'havia de fer
  vuit vegades (o quedava a mitges en alguna).

inputs:
  missatge:
    description: El text del commit.
    required: true
  fitxers:
    description: >-
      Què s'afegeix a l'índex, en format de "pathspec" de git i separat per
      espais. Per defecte, tot el que hagi canviat.

      COMPTE amb els pathspecs negatius (":!alguna/cosa"): si l'ordre en porta
      cap i pel camí hi ha rutes ignorades pel .gitignore, el git add no les
      afegeix però surt amb codi 1 i el pas es posa vermell. Amb pathspecs
      normals se les salta en silenci. Val més dir què s'ha d'afegir que no
      pas què s'ha de deixar fora.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Comitejar i pujar
      shell: bash
      env:
        MISSATGE: ${{ inputs.missatge }}
        FITXERS: ${{ inputs.fitxers }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        set -f
        git add -- $FITXERS
        set +f

        git commit -m "$MISSATGE" || echo "No s'han detectat canvis nous per guardar"

        # El pull i el push es reintenten, esperant una estona entre intent i
        # intent, perquè GitHub de tant en tant respon amb un "Internal Server
        # Error" passatger (la nit del 6 al 7 de novembre de 2026 va fer perdre
        # l'actualització de dades: el commit era fet però no va arribar a pujar).
        # Només es dóna el pas per fallit si fallen tots els intents.
        #
        # El pull va dins del bucle (i no pas només el push) perquè si el push
        # és rebutjat perquè main s'ha mogut, cal tornar a baixar-la i refer el
        # rebase abans de pujar.
        ESPERES=(30 60 120 240)
        intent=1
        until git pull --rebase origin main && git push; do
          if [ "$intent" -gt "${#ESPERES[@]}" ]; then
            echo "::error::No s'ha pogut pujar el commit després de $intent intents."
            exit 1
          fi
          espera=${ESPERES[$((intent - 1))]}
          echo "::warning::Intent $intent fallit; torno a provar d'aquí a ${espera} s."
          # Si el pull ha petat a mig rebase, es deixa l'arbre net abans de
          # tornar-hi (el commit local no es perd).
          git rebase --abort 2>/dev/null || true
          sleep "$espera"
          intent=$((intent + 1))
        done
