name: Bot de Rimes a Twitter (matí, normals)

on:
  #schedule:
  #  - cron: '0 2 * * *'
  
  workflow_dispatch:

jobs:
  publicar_tuit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències (Tweepy)
        run: |
          pip install tweepy
          pip install numpy

      - name: Executar l'script de Python 
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python bot/script_normal.py

      - name: Guardar els canvis al JSON (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot/publicades_normal.json
          git commit -m "Actualització automàtica: Rima diària afegida a publicades_normal.json" || echo "Cap canvi per fer commit"
          git push
