name: Deploy Gulp site to Pages

on:
  push:
    branches: ["main"]
    # Coses que no arriben mai al lloc publicat. GitHub només salta l'execució
    # si TOTS els fitxers del push encaixen aquí: un push mixt desplega igual.
    #
    # Compte amb el que NO hi ha i podria semblar que hi hauria de ser: css/ i
    # js/ són la font del gulp, i package*.json i el gulpfile manen com es
    # compila. Tot això canvia el que es publica encara que no s'hi pugi tal com
    # és, i per tant ha de desplegar.
    paths-ignore:
      - '**/*.py'
      - '**/*.md'
      - '.github/**'
      - '.gitignore'
      - 'claude.txt'
      - 'pronoms/**'
      # Tocar el diccionari dispara el workflow que el regenera, i aquell ja
      # encadena el desplegament quan ha acabat (vegeu el workflow_run de sota).
      # El deploy directe només publicaria les columnes velles, perquè les noves
      # encara s'estan generant mentre ell corre.
      - 'diccionaris/diccionari*.txt'
      - 'diccionaris/col_10.txt'
      - 'diccionaris/separat/**'
      # Igual amb les transcripcions dels dialectes: disparen el mateix
      # workflow, que refà la rima i encadena el desplegament quan ha acabat.
      - 'dialectes_col/**'
  # Els workflows que comiten amb el GITHUB_TOKEN no disparen cap "push": és
  # la regla de GitHub per evitar bucles infinits. Per tant, tot workflow que
  # generi fitxers que el lloc publica ha de ser en aquesta llista, o els seus
  # canvis es quedarien al repositori sense arribar mai a Pages.
  workflow_run:
    workflows:
      - "Actualització nocturna de dades (estadístiques i classificació)"
      - "Canvis al diccionari (i generació de nàufragues i heptasíl·labs)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Un sol desplegament a la vegada. Sense això, dos push seguits fan córrer dos
# deploys en paral·lel: l'actions/deploy-pages peta si en troba un altre en
# marxa, i els dos jobs es barallen pel git push del cache busting.
#
# cancel-in-progress: false i no pas true: aquest job fa commits, i cancel·lar-lo
# a mig push deixaria el repositori a mitges. Encuant-los, a més, hi ha l'ordre
# garantit: quan un canvi al diccionari dispara alhora el deploy del push i el
# de la cadena, el segon entra després i és l'últim que publica. GitHub només
# guarda una execució en espera per grup i descarta les anteriors, o sigui que
# una ratxa de push no fa cua sinó que es queda amb l'última.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Si la generació del diccionari ha petat, no hi ha res de nou per publicar
    # i el que hi hagi al repositori pot estar a mitges.
    #
    # Les dades de la nit, en canvi, es publiquen encara que el job acabi
    # vermell: cadascun dels dos scripts desfà el que ha escrit si peta (vegeu
    # dades_nocturnes.yml), o sigui que el que s'ha comitejat és bo, i el
    # vermell només hi és perquè arribi el correu. Si no es publiqués, que
    # petessin les estadístiques deixaria la classificació d'ahir comitejada
    # però sense arribar al joc fins a la nit següent.
    #
    # El nom ha de ser el mateix "name:" de dades_nocturnes.yml, com a la
    # llista del workflow_run de dalt.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'Actualització nocturna de dades (estadístiques i classificació)')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Sempre la punta de main, no pas el SHA de l'esdeveniment. En els
          # workflow_run, el SHA pot ser anterior als commits que acaba de fer
          # el workflow d'abans, que són justament els que hem de publicar.
          ref: main

      - name: Detectar canvis en CSS o JS
        id: canvis
        run: |
          # Els workflows encadenats només toquen dades (estadístiques, columnes
          # del diccionari, llistes), mai css ni js. Aquí no hi ha cap push de
          # codi al darrere per comparar, i el github.event.before ni tan sols
          # existeix: si ho deixéssim caure a la branca de sota, cada nit
          # rebentaríem la memòria cau del css i el js de tots els visitants
          # sense que hagués canviat res.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Ve d'un workflow encadenat (només dades): no cal refrescar les versions."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ABANS="${{ github.event.before }}"
          # El workflow_dispatch no té cap "abans" i cau aquí a posta: engegar-lo
          # a mà vol dir justament demanar un refresc complet de les versions.
          if [ -z "$ABANS" ] || [ "$ABANS" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ABANS^{commit}" 2>/dev/null; then
            echo "No hi ha commit anterior per comparar; refresquem les versions per si de cas."
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # avis/ no passa pel gulp (és un mòdul a part, vegeu avis/README.md),
          # però els HTML hi apunten amb ?v=, o sigui que també ha de refrescar
          # les versions. El missatges.json no hi és a posta: el llegeix el
          # navegador en temps real i canviar-ne un text no ha de tocar cap HTML.
          #
          # Del joc/, el CSS SÍ que passa pel gulp (joc/css/joc.scss -> la tasca
          # styles-joc -> dist/css/joc.min.css, compartint el _variables.scss amb
          # el full del lloc) i el JS no: són mòduls ES que se serveixen tal com
          # són. Tots dos juguen amb les mateixes regles que l'arrel: el seu HTML
          # i els seus mòduls porten ?v= i s'han de refrescar quan canvien. Les
          # DADES del joc no hi són perquè no en necessiten: van amb el resum del
          # seu contingut, que escriu joc/eines/generar_dades.py al
          # joc/dades/versions.json.
          if git diff --name-only "$ABANS" "${{ github.sha }}" -- 'css/*.scss' 'js/*.js' 'avis/*.js' 'avis/*.css' 'joc/js/*.js' 'joc/css/*.scss' | grep -q .; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm ci i no pas npm install: instal·la exactament el que diu el
        # package-lock.json (no el toca ni el reescriu) i és més ràpid, perquè
        # no ha de resoldre res.
        run: npm ci

      - name: Run Gulp
        run: npx gulp

      - name: Rebentar Memòria Cau (Actualitzar versions HTML) 
        if: steps.canvis.outputs.any_changed == 'true'
        run: |
          NOVA_VERSIO=${GITHUB_SHA::7}
          echo "S'han detectat canvis al codi! Aplicant la versió $NOVA_VERSIO als HTML..."
          
          find . -type f -name "*.html" -exec sed -i -E "s/(\.js\?v=)[^\"]*/\1$NOVA_VERSIO/g" {} +
          find . -type f -name "*.html" -exec sed -i -E "s/(\.css\?v=)[^\"]*/\1$NOVA_VERSIO/g" {} +

          # Els mòduls del joc s'importen els uns als altres, i una importació
          # no hereta el ?v= de l'etiqueta <script> que va carregar el primer.
          # Sense aquesta línia, refrescar joc/js/principal.js deixava els
          # altres vuit mòduls a la memòria cau del navegador: es barrejaven
          # versions i el ?v= de l'HTML no volia dir gairebé res.
          #
          # Van amb cometes simples perquè són codi JS ("from './ui.js?v=...'"),
          # no atributs d'HTML.
          find joc/js -type f -name "*.js" -exec sed -i -E "s/(\.js\?v=)[^']*/\1$NOVA_VERSIO/g" {} +

      - name: Guardar els HTML actualitzats al repositori
        if: steps.canvis.outputs.any_changed == 'true'
        uses: ./.github/actions/comitejar
        with:
          missatge: 'Cache busting: versions actualitzades als HTML i als mòduls del joc'
          # Només els HTML i els mòduls del joc, que són els dos llocs on el
          # pas de sobre ha escrit el ?v=. En aquest job també s'hi ha compilat
          # el gulp i, més avall, s'hi esborren carpetes senceres per aprimar el
          # paquet: amb un "git add ." tot allò també entraria al commit.
          fitxers: "*.html joc/js/*.js"

      - name: Ajustar el 404.html quan el lloc no penja de l'arrel del domini
        if: github.repository != 'rimador/rimador.github.io'
        run: |
          # El 404.html és l'única pàgina amb rutes absolutes des de l'arrel: se
          # serveix sota qualsevol URL inexistent (/a/b/c/...), i per tant no pot
          # fer servir rutes relatives, que dependrien de la fondària. La resta
          # de pàgines van amb rutes relatives i el JS es calcula l'arrel tot sol
          # (vegeu ARREL a js/components.js), o sigui que no cal tocar-los.
          #
          # A rimador.cat el lloc penja de l'arrel i les rutes ja són bones. En
          # canvi, als repositoris de proves GitHub Pages publica el lloc dins
          # /NOM-DEL-REPOSITORI/, i cal anteposar-hi aquest prefix.
          PREFIX="/${{ github.event.repository.name }}"
          echo "El lloc penja de $PREFIX/: reescrivint les rutes del 404.html"
          sed -i -E "s|=\"/|=\"$PREFIX/|g" 404.html
          grep -oE '(src|href)="[^"]*"' 404.html | grep -v 'https\?://'

      # Va aquí i no abans per la mateixa raó que el pas de sota: després de
      # tots els git push. Així el sitemap.xml regenerat entra al paquet que es
      # publica però no s'acosta mai a cap commit, i el que hi ha al repositori
      # es queda tal com el vam escriure a mà.
      - name: Regenerar el sitemap.xml
        run: |
          python3 - <<'PY'
          import glob, os, re

          # La font de la veritat és el <link rel="canonical"> de cada pàgina,
          # no pas la ruta del fitxer. Així el sitemap no es pot desdir del que
          # diu la pàgina mateixa: si un dia un canonical canvia, el sitemap el
          # segueix tot sol. I una pàgina nova hi entra sense tocar res, sempre
          # que dugui canonical (que és el que ha de dur igualment).
          #
          # Les noindex en queden fora: dir-li a Google "indexa aquesta" al
          # sitemap i "no la indexis" a la pàgina és un senyal contradictori.
          # Avui això vol dir el 404.html, que a més no té canonical.
          canonical = re.compile(r'<link\s+rel="canonical"\s+href="([^"]+)"')
          noindex   = re.compile(r'<meta\s+name="robots"\s+content="[^"]*noindex')

          urls = []
          for cami in glob.glob('**/*.html', recursive=True):
              if cami.startswith(('node_modules/', 'html/')):
                  continue
              html = open(cami, encoding='utf-8').read()
              if noindex.search(html):
                  print('  (noindex, fora)  %s' % cami)
                  continue
              trobat = canonical.search(html)
              if not trobat:
                  print('  AVIS: %s no té canonical i es queda fora del sitemap' % cami)
                  continue
              urls.append(trobat.group(1))

          urls.sort()
          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<!-- Generat a cada desplegament des dels canonical de les pàgines.\n')
              f.write('     Vegeu "Regenerar el sitemap.xml" a .github/workflows/deploy.yml. -->\n')
              f.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for u in urls:
                  f.write('  <url>\n    <loc>%s</loc>\n  </url>\n' % u)
              f.write('</urlset>\n')

          print('sitemap.xml: %d pàgines' % len(urls))
          for u in urls:
              print('  ' + u)

          if not urls:
              raise SystemExit('ERROR: el sitemap ha quedat buit.')
          PY

      # Va DESPRÉS de tots els git push d'aquest job, a posta: aquí esborrem
      # fitxers que sí que són al repositori, i si quedés cap "git add" per
      # sota, comitejaríem les esborrades.
      - name: Aprimar el paquet abans de publicar
        run: |
          # El paquet de Pages es puja sencer a cada desplegament. Tot això és
          # font o feina interna que el navegador no demana mai:
          #
          #   node_modules                      les dependències del gulp
          #   diccionari*.txt                   font d'on surten les columnes
          #   diccionaris/col_10.txt            font que edites a mà: 76 MB
          #   dialectes_col/**/*.txt            les columnes planes, que són la
          #                                     font (la transcripció, la rima i
          #                                     les col_10 dels apendixs). Les
          #                                     internades SÍ que s'han de
          #                                     publicar: són el que es baixa el
          #                                     navegador
          #   pronoms/                          no hi ha res del lloc que hi apunti
          #   bot/programador/                  eina local per programar els tuits
          #                                     a mà: només funciona amb el seu
          #                                     servidor de Python al davant
          #
          # El que SÍ que s'ha de publicar de diccionaris/ són les col_0..col_8,
          # la carpeta internat/ i el versions.json: això és el que es baixa el
          # navegador (vegeu llegirFitxerAmbIndexedDB a js/script.js).
          abans=$(du -sm . | cut -f1)
          rm -rf node_modules
          rm -f  diccionaris/diccionari*.txt
          rm -f  diccionaris/col_10.txt
          rm -rf pronoms
          # De dialectes_col/ el navegador demana les internades i les col_0 dels
          # apendixs; la resta és font i no la mira ningú.
          #
          # LES COL_0 DELS APENDIXS es queden pel mateix motiu que la col_0 del
          # diccionari: les paraules no s'internen (el 85 % són úniques) i el
          # navegador se les baixa tal com són. Encara no les demana —el
          # js/script.js d'ara no sap què és un apendix—, però ja són al
          # versions.json i pesen deu megues entre totes quatre.
          #
          # I compte amb el -not -path: sense ell això s'enduria també les
          # internades, que és justament el que s'ha de publicar. La versió
          # d'abans se'n sortia amb un -maxdepth 2, i va deixar de funcionar en
          # silenci el dia que les columnes van baixar a trans_dicc/ i apendix/:
          # el paquet se n'anava a Pages amb cent megues de transcripcions.
          find dialectes_col -name '*.txt' \
               -not -path '*/internat/*' \
               -not -name 'col_0_*.txt' \
               -delete
          rm -rf bot/programador
          echo "Paquet: ${abans} MB -> $(du -sm . | cut -f1) MB"

          # Xarxa de seguretat: si un dia el lloc passa a demanar alguna
          # d'aquestes coses, val més que peti aquí que no pas servir un 404
          # silenciós als visitants.
          for cal in diccionaris/versions.json \
                     joc/dades/versions.json \
                     diccionaris/separat/col_0.txt \
                     diccionaris/separat/internat \
                     dialectes_col/ca/trans_dicc/internat/col_3_rimacons_ca.idx.txt \
                     dialectes_col/ca/trans_dicc/internat/col_4_rimaass_ca.idx.txt \
                     dialectes_col/ca/apendix/col_0_ca.txt \
                     dialectes_col/ca/apendix/internat/col_3_ca.apendix.idx.txt \
                     dist/css/styles.min.css \
                     dist/css/joc.min.css \
                     dist/js/script.min.js \
                     sitemap.xml \
                     robots.txt; do
            if [ ! -e "$cal" ]; then
              echo "ERROR: falta $cal al paquet, que el navegador sí que demana."
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5