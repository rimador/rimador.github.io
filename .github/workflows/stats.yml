name: Actualització automàtica de les estadístiques

on:
  schedule:
    - cron: '1 22 * * *'
  workflow_dispatch:

jobs:
  publicar_tuit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          pip install tweepy

      - name: Executar l'script de Python 
        run: python stats/stats.py

      - name: Guardar els canvis al JSON (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats/estadistiques_rimador.json
          git commit -m "Actualització automàtica: Estadístiques actualitzades" || echo "Cap canvi per fer commit"
          git push