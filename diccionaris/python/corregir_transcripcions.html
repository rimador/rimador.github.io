<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corregir transcripcions</title>
<style>
  :root {
    --fons: #f6f5f2; --paper: #fff; --tinta: #1d1d1b; --suau: #6b6a66; --vora: #dedcd6;
    --accent: #b5462b; --be: #2e7d4f; --mal: #b3261e; --avis: #a76a00; --canviat: #fff5d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fons: #18181a; --paper: #222225; --tinta: #ececea; --suau: #9c9b97; --vora: #38383c;
      --accent: #e0785c; --be: #6cc391; --mal: #f08a82; --avis: #e0b25c; --canviat: #3a3320;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fons); color: var(--tinta);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .nota { color: var(--suau); font-size: 13px; margin: 0 0 18px; }
  form.cerca { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0;
               padding: 10px 0; background: var(--fons); z-index: 2; }
  form.cerca .fila { display: flex; flex-wrap: wrap; gap: 8px; }
  form.cerca .modes label { padding-block: 6px; }
  form.cerca.fonetica input[type=search] { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif;
                                           font-size: 18px; }
  select { font: inherit; font-size: 14px; color: inherit; padding: 4px 8px; border: 1px solid var(--vora);
           border-radius: 8px; background: var(--paper); }
  input, button { font: inherit; color: inherit; }
  input[type=search] { flex: 1; padding: 9px 12px; border: 1px solid var(--vora);
                       border-radius: 8px; background: var(--paper); }
  button { padding: 8px 14px; border: 1px solid var(--vora); border-radius: 8px;
           background: var(--paper); cursor: pointer; }
  button.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .simbols { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 16px; }
  .simbols button { padding: 3px 9px; font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif;
                    font-size: 16px; min-width: 34px; }
  .estat { color: var(--suau); margin: 8px 0; }
  .estat.error { color: var(--mal); }
  .targeta { background: var(--paper); border: 1px solid var(--vora); border-radius: 10px;
             padding: 14px 16px; margin: 0 0 14px; }
  .cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 10px; }
  .cap strong { font-size: 18px; }
  .cap .meta { color: var(--suau); font-size: 13px; }
  .etiqueta { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--vora); }
  .enllacos { display: flex; gap: 6px; margin-left: auto; }
  .enllac { font-size: 12px; padding: 1px 8px; border-radius: 99px; text-decoration: none; }
  a.enllac { border: 1px solid var(--be); color: var(--be); }
  a.enllac:hover { background: var(--be); color: var(--paper); }
  span.enllac { border: 1px dashed var(--vora); color: var(--suau); text-decoration: line-through; }
  .dialecte { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; align-items: center;
              padding: 6px 0; border-top: 1px dashed var(--vora); }
  .dialecte:first-of-type { border-top: 0; }
  .dialecte label { font-weight: 600; font-size: 14px; }
  .dialecte.coincideix label { color: var(--accent); }
  .dialecte.coincideix label::after { content: " ●"; font-size: 10px; vertical-align: middle; }
  .dialecte input { width: 100%; padding: 6px 10px; border: 1px solid var(--vora); border-radius: 6px;
                    background: var(--paper); font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif;
                    font-size: 18px; }
  .dialecte input.canviat { background: var(--canviat); }
  .dialecte input.invalid { border-color: var(--mal); }
  .detall { grid-column: 2; font-size: 13px; color: var(--suau); }
  .detall .ipa { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif; font-size: 15px; color: var(--tinta); }
  .detall .mal { color: var(--mal); }
  .detall .avis { color: var(--avis); }
  .detall .abans { text-decoration: line-through; }
  a.cerca { color: inherit; text-decoration-style: dotted; text-underline-offset: 3px; }
  a.cerca:hover { color: var(--accent); }
  /* Les llistes de rima i de lema: els dialectes l'un al costat de l'altre,
     perquè d'una ullada es vegi com sona cada entrada a tot arreu. */
  .targeta.compacta { padding: 10px 14px; margin-bottom: 10px; }
  .compacta .cap { margin-bottom: 6px; }
  .compacta .dialectes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .compacta .dialecte { display: flex; flex-direction: column; align-items: stretch; gap: 2px;
                        padding: 0; border-top: 0; }
  .compacta .dialecte label { font-size: 12px; }
  .compacta .dialecte input { font-size: 16px; padding: 4px 8px; }
  .compacta .detall { font-size: 12px; }
  .compacta .detall .ipa { font-size: 14px; }
  .compacta .accions { margin-top: 6px; }
  @media (max-width: 700px) {
    .compacta .dialectes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .accions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; }
  .accions .missatge { margin-right: auto; font-size: 13px; }
  .missatge.be { color: var(--be); }
  .missatge.mal { color: var(--mal); }
  .modes { display: flex; border: 1px solid var(--vora); border-radius: 8px; overflow: hidden;
           background: var(--paper); }
  .modes label { display: flex; align-items: center; padding: 0 12px; cursor: pointer;
                 font-size: 14px; white-space: nowrap; }
  .modes[hidden] { display: none; }
  .modes label + label { border-left: 1px solid var(--vora); }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label:has(input:checked) { background: var(--tinta); color: var(--fons); }
  .modes label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .suggeriments { display: flex; flex-wrap: wrap; gap: 6px; }
  .suggeriments button { padding: 4px 10px; }
  .mes { display: flex; gap: 8px; }
  .mes button { flex: 1; padding: 12px; }
  @media (max-width: 560px) {
    .modes { flex: 1 1 100%; }
    .modes label { flex: 1; justify-content: center; padding: 8px 6px; }
  }
  section.registre h2 { font-size: 15px; margin: 30px 0 8px; }
  section.registre ul { list-style: none; padding: 0; margin: 0; }
  section.registre li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0;
                        border-top: 1px solid var(--vora); font-size: 14px; }
  section.registre li span { flex: 1; }
  section.registre li .ipa { font-family: "Charis SIL", "Doulos SIL", "Gentium Plus", serif; }
  @media (max-width: 560px) {
    .dialecte { grid-template-columns: 1fr; }
    .detall { grid-column: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>Corregir transcripcions</h1>
  <p class="nota">Escriu directament a les <code>col_10</code>. Abans de començar, <code>git pull</code>;
    en acabar, commit i push de la <code>col_10</code> i el workflow refà les rimes.</p>

  <form class="cerca" id="cerca">
    <div class="fila">
      <input type="search" id="text" placeholder="Paraula" autofocus autocomplete="off" spellcheck="false">
      <button class="principal">Cerca</button>
    </div>
    <div class="fila">
      <div class="modes" role="radiogroup" aria-label="On cercar">
        <label><input type="radio" name="on" value="paraula" checked>Paraula</label>
        <label><input type="radio" name="on" value="lema">Lema</label>
        <label><input type="radio" name="on" value="fonetica">Fonètica</label>
        <label><input type="radio" name="on" value="rima">Rima</label>
      </div>
      <div class="modes" id="com" role="radiogroup" aria-label="Com cercar">
        <label><input type="radio" name="mode" value="exacta" checked>Exacta</label>
        <label><input type="radio" name="mode" value="comenca">Comença per</label>
        <label><input type="radio" name="mode" value="acaba">Acaba per</label>
      </div>
      <select id="dialecte" aria-label="Dialecte" hidden>
        <option value="">tots els dialectes</option>
      </select>
    </div>
  </form>
  <div class="simbols" id="simbols" title="Insereix el símbol al camp on eres"></div>

  <div class="estat" id="estat"></div>
  <div id="resultats"></div>

  <section class="registre" id="registre" hidden>
    <h2>Desat en aquesta sessió</h2>
    <ul id="llista-registre"></ul>
  </section>
</main>

<script>
const SIMBOLS = "ˈ ˌ ə ɛ ɔ ɾ r ʎ ɲ ŋ ʒ ʃ ɡ β ð ɣ ɱ z j w".split(" ");
const ORDRE = ["ca", "nw", "va", "ba"];
let config = { dialectes: {}, vocals: "", accent: "ˈ", inventari: "" };
let darrerCamp = null;
const registre = [];

const $ = id => document.getElementById(id);
const esc = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// La mateixa regla que calcular_rimes() del columnes.py: la rima consonant és
// el que hi ha darrere l'últim accent primari, i l'assonant, les seves vocals.
function rimes(transcripcio) {
  const consonant = transcripcio.split(config.accent).pop();
  const assonant = [...consonant].filter(c => config.vocals.includes(c)).join("");
  return { consonant, assonant };
}

function problemes(valor) {
  const errors = [];
  if (!valor.trim()) errors.push("és buida");
  else if (valor !== valor.trim()) errors.push("té espais al davant o al darrere");
  const estranys = [...new Set([...valor].filter(c => !config.inventari.includes(c)))];
  if (estranys.length) errors.push("símbols fora de l'inventari: " + estranys.join(" "));
  return errors;
}

function estat(text, error = false) {
  $("estat").textContent = text;
  $("estat").className = "estat" + (error ? " error" : "");
}

// [una, unes quantes]: "cap entrada que soni" i "3 entrades que sonin".
const NOMS_MODES = {
  exacta: ["que soni", "que sonin"],
  comenca: ["que comenci per", "que comencin per"],
  acaba: ["que acabi en", "que acabin en"],
};
const NOMS_RIMA = ["que rimi", "que rimin"];

// El que es demana al camp de text, segons on es cerqui.
const INDICACIONS = {
  paraula: "Paraula",
  lema: "Lema o una de les seves formes (inepte, inepta…)",
  fonetica: "Transcripció (dˈɔnə, ɔnə, kˈant…)",
  rima: "Rima (ɛktə) o una transcripció (pəɾfˈɛktə)",
};
// Les que surten amb els dialectes l'un al costat de l'altre.
const COMPACTES = ["lema", "rima"];

// Una cerca en una altra pestanya, des d'una targeta: així no es perd el que
// tinguis a mig corregir en aquesta.
const enllacCerca = (text, on, dialecte = "") =>
  `?q=${encodeURIComponent(text)}&on=${on}` + (dialecte ? `&dialecte=${dialecte}` : "");

const triat = nom => document.querySelector(`input[name="${nom}"]:checked`).value;

// Com es cerca: el que diuen els controls del formulari.
function opcionsTriades() {
  return { mode: triat("mode"), on: triat("on"), dialecte: $("dialecte").value };
}

// Posa els controls com diu una cerca (quan no l'ha feta el formulari: un
// suggeriment, el registre, l'adreça).
function posarOpcions({ mode, on, dialecte }) {
  document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;
  document.querySelector(`input[name="on"][value="${on}"]`).checked = true;
  $("dialecte").value = dialecte;
  refrescarFormulari();
}

function refrescarFormulari() {
  const on = triat("on");
  const fonetica = on === "fonetica" || on === "rima";
  $("cerca").classList.toggle("fonetica", fonetica);
  $("dialecte").hidden = !fonetica;
  // La rima i el lema no tenen "comença per" ni "acaba per".
  $("com").hidden = on === "lema" || on === "rima";
  $("text").placeholder = INDICACIONS[on];
}

// Quan l'exacta no troba res: les paraules semblants, per triar-ne una.
function botonsDeParaules(paraules) {
  const caixa = document.createElement("div");
  caixa.className = "suggeriments";
  for (const paraula of paraules) {
    const boto = document.createElement("button");
    boto.textContent = paraula;
    boto.onclick = () => cercar(paraula, PER_PARAULA);
    caixa.append(boto);
  }
  return caixa;
}

const PER_PARAULA = { mode: "exacta", on: "paraula", dialecte: "" };
const nombre = n => n.toLocaleString("ca");

function cercaUrl(text, { mode, on, dialecte }, desDe = 0, totes = false) {
  return `/api/cerca?q=${encodeURIComponent(text)}&mode=${mode}&on=${on}`
       + `&dialecte=${dialecte}&des_de=${desDe}` + (totes ? "&totes=1" : "");
}

// rima i lemes són els que el servidor diu que ha cercat de debò: la rima que
// ha tret de la transcripció, i els lemes de la forma que li has donat.
function descripcio(text, { mode, on, dialecte }, quantes, { rima, lemes } = {}) {
  const nombre_ = quantes === 1 ? 0 : 1;
  if (on === "paraula") return `${NOMS_MODES[mode][nombre_]} «${text}»`;
  if (on === "lema") {
    if (lemes?.length > 1) return `dels lemes ${lemes.map(lema => `«${lema}»`).join(", ")}`;
    return `del lema «${lemes?.[0] ?? text}»`;
  }
  const on_ = dialecte ? `en ${config.dialectes[dialecte] || dialecte}` : "en algun dialecte";
  if (on === "rima") return `${NOMS_RIMA[nombre_]} en -${rima ?? text} ${on_}`;
  return `${NOMS_MODES[mode][nombre_]} /${text}/ ${on_}`;
}

// Les cerques per pàgines: totes les entrades per ordre alfabètic, de
// cinquanta en cinquanta, i al final un botó per carregar les següents i un
// altre per carregar-les totes.
function mostrarPagina(text, opcions, resposta) {
  const { resultats, total, des_de: desDe } = resposta;
  const fins = desDe + resultats.length;
  estat(`${nombre(total)} ${total === 1 ? "entrada" : "entrades"} ${descripcio(text, opcions, total, resposta)}`
        + (fins < total ? ` · en surten ${nombre(fins)}` : ""));
  const compacta = COMPACTES.includes(opcions.on);
  for (const entrada of resultats) $("resultats").append(targeta(entrada, compacta));
  if (fins >= total) return;

  const botons = document.createElement("div");
  botons.className = "mes";
  const carregar = (etiqueta, totes) => {
    const boto = document.createElement("button");
    boto.textContent = etiqueta;
    boto.onclick = async () => {
      for (const altre of botons.children) altre.disabled = true;
      boto.textContent = "Carregant…";
      const seguent = await fetch(cercaUrl(text, opcions, fins, totes)).then(r => r.json());
      botons.remove();
      mostrarPagina(text, opcions, seguent);
    };
    botons.append(boto);
  };
  carregar(`Carrega'n ${Math.min(resultats.length, total - fins)} més`, false);
  if (total - fins > resultats.length) carregar(`Carrega-les totes (${nombre(total - fins)} més)`, true);
  $("resultats").append(botons);
}

async function cercar(text, opcions = opcionsTriades()) {
  $("text").value = text;
  posarOpcions(opcions);
  // La primera cerca per fonètica (o per rima) fa que el servidor llegeixi
  // totes les transcripcions, i triga uns segons: que no sembli penjat.
  estat(opcions.on === "fonetica" || opcions.on === "rima"
        ? "Cercant… (la primera cerca per fonètica o per rima triga uns segons)" : "Cercant…");
  $("resultats").innerHTML = "";
  const resposta = await fetch(cercaUrl(text, opcions)).then(r => r.json());

  if (opcions.on !== "paraula" || opcions.mode !== "exacta") {
    if (!resposta.total) return estat(`No hi ha cap entrada ${descripcio(text, opcions, 1, resposta)}.`, true);
    mostrarPagina(text, opcions, resposta);
    darrerCamp = $("resultats").querySelector(".dialecte input");
    return;
  }

  const resultats = resposta.resultats;
  if (!resultats.length) return estat(`No hi ha cap «${text}».`, true);
  if (resposta.suggeriments) {
    estat(`No hi ha cap «${text}». Potser volies dir:`);
    return $("resultats").append(botonsDeParaules(resultats.map(r => r.suggeriment)));
  }

  estat(resultats.length === 1 ? "1 entrada" : `${resultats.length} entrades`);
  for (const entrada of resultats) $("resultats").append(targeta(entrada));
  const primer = $("resultats").querySelector(".dialecte input");
  if (primer) darrerCamp = primer;
}

// Les mateixes adreces que el web (vegeu ADRECES a js/script.js): el
// Viccionari i el DIEC per lema, i la Viquipèdia per la forma tal com es veu,
// que allà els articles porten el títol sencer.
const FONTS = [
  { clau: "Vicc", nom: "Viccionari", adreca: e => "https://ca.wiktionary.org/wiki/" + encodeURIComponent(e.lema) },
  { clau: "Viq", nom: "Viquipèdia", adreca: e => "https://ca.wikipedia.org/wiki/" + encodeURIComponent(e.paraula) },
  { clau: "Diec", nom: "DIEC", adreca: e => "https://dlc.iec.cat/Results?DecEntradaText=" + encodeURIComponent(e.lema) },
];

function enllacos(entrada) {
  if (!entrada.enllacos) return "";
  return `<span class="enllacos">${FONTS.map(font => entrada.enllacos[font.clau]
    ? `<a class="enllac" href="${font.adreca(entrada)}" target="_blank" rel="noopener" title="Té entrada a ${font.nom}">${font.nom}</a>`
    : `<span class="enllac" title="No té entrada a ${font.nom}">${font.nom}</span>`).join("")}</span>`;
}

function targeta(entrada, compacta = false) {
  const caixa = document.createElement("div");
  caixa.className = "targeta" + (compacta ? " compacta" : "");
  const lloc = codi => ORDRE.includes(codi) ? ORDRE.indexOf(codi) : ORDRE.length;
  const codis = Object.keys(entrada.transcripcions).sort((a, b) => lloc(a) - lloc(b));

  caixa.innerHTML = `
    <div class="cap">
      <strong>${esc(entrada.paraula)}</strong>
      <span class="meta">lema <a class="cerca" href="${esc(enllacCerca(entrada.lema, "lema"))}" target="_blank"
        title="Totes les formes del lema, en una altra pestanya">${esc(entrada.lema)}</a>
        · ${esc(entrada.codi)} · fila ${entrada.fila + 1}</span>
      <span class="etiqueta">${esc(entrada.etiqueta)}</span>
      ${enllacos(entrada)}
    </div>
    <div class="dialectes">
    ${codis.map(codi => `
      <div class="dialecte${entrada.coincideixen?.includes(codi) ? " coincideix" : ""}" data-codi="${codi}">
        <label for="c-${entrada.fitxer}-${entrada.fila}-${codi}">${esc(config.dialectes[codi] || codi)}</label>
        <input id="c-${entrada.fitxer}-${entrada.fila}-${codi}" spellcheck="false" autocomplete="off">
        <div class="detall"></div>
      </div>`).join("")}
    </div>
    <div class="accions">
      <span class="missatge"></span>
      <button data-accio="restaura" disabled>Restaura</button>
      <button class="principal" data-accio="desa" disabled>Desa</button>
    </div>`;

  const camps = {};
  for (const codi of codis) {
    const input = caixa.querySelector(`[data-codi="${codi}"] input`);
    input.value = entrada.transcripcions[codi];
    input.addEventListener("input", refrescar);
    input.addEventListener("focus", () => darrerCamp = input);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); desar(); }
      if (e.key === "Escape") restaurar();
    });
    camps[codi] = input;
  }
  const missatge = caixa.querySelector(".missatge");
  const botoDesa = caixa.querySelector('[data-accio="desa"]');
  const botoRestaura = caixa.querySelector('[data-accio="restaura"]');
  botoDesa.onclick = desar;
  botoRestaura.onclick = restaurar;

  function refrescar() {
    let canviat = false, valid = true;
    for (const codi of codis) {
      const input = camps[codi];
      const valor = input.value, original = entrada.transcripcions[codi];
      const errors = problemes(valor);
      const r = rimes(valor), abans = rimes(original);
      input.classList.toggle("canviat", valor !== original);
      input.classList.toggle("invalid", errors.length > 0);
      canviat ||= valor !== original;
      valid &&= errors.length === 0;

      const rima = r.consonant
        ? `<a class="cerca ipa" href="${esc(enllacCerca(r.consonant, "rima", codi))}" target="_blank"
             title="Totes les que rimen en -${esc(r.consonant)} en ${esc(config.dialectes[codi] || codi)}, en una altra pestanya">-${esc(r.consonant)}</a>`
        : `<span class="ipa">-</span>`;
      let html = `rima ${rima} · assonant <span class="ipa">-${esc(r.assonant)}</span>`;
      if (valor !== original && r.consonant !== abans.consonant)
        html += ` · abans <span class="ipa abans">-${esc(abans.consonant)}</span>`;
      if (!valor.includes(config.accent))
        html += ` · <span class="avis">sense accent primari: rima amb la paraula sencera</span>`;
      if (errors.length) html += ` · <span class="mal">${esc(errors.join("; "))}</span>`;
      input.parentElement.querySelector(".detall").innerHTML = html;
    }
    botoDesa.disabled = !canviat || !valid;
    botoRestaura.disabled = !canviat;
    if (canviat) missatge.textContent = "", missatge.className = "missatge";
  }

  function restaurar() {
    for (const codi of codis) camps[codi].value = entrada.transcripcions[codi];
    refrescar();
  }

  async function desar() {
    if (botoDesa.disabled) return;
    const noves = Object.fromEntries(codis.map(codi => [codi, camps[codi].value]));
    botoDesa.disabled = true;
    missatge.textContent = "Desant…";
    missatge.className = "missatge";
    const resposta = await fetch("/api/desa", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fitxer: entrada.fitxer, fila: entrada.fila, linia: entrada.linia, transcripcions: noves }),
    });
    const dades = await resposta.json();
    if (!resposta.ok) {
      missatge.textContent = dades.error;
      missatge.className = "missatge mal";
      return refrescar();
    }
    const abans = { ...entrada.transcripcions };
    Object.assign(entrada, dades.entrada);
    refrescar();
    missatge.textContent = "Desat a la col_10.";
    missatge.className = "missatge be";
    apuntar(entrada, abans, { ...entrada.transcripcions });
  }

  refrescar();
  return caixa;
}

function apuntar(entrada, abans, despres) {
  registre.unshift({ entrada, abans, despres });
  $("registre").hidden = false;
  const li = document.createElement("li");
  const canvis = Object.keys(despres).filter(codi => abans[codi] !== despres[codi])
    .map(codi => `${esc(config.dialectes[codi] || codi)}: <span class="ipa">${esc(abans[codi])}</span> → <span class="ipa">${esc(despres[codi])}</span>`)
    .join(" · ");
  li.innerHTML = `<span><strong>${esc(entrada.paraula)}</strong> <small>(${esc(entrada.codi)}, ${esc(entrada.etiqueta)})</small> — ${canvis}</span>`;
  const torna = document.createElement("button");
  torna.textContent = "Torna-hi";
  torna.title = "Torna a cercar la paraula per tornar-la a mirar o desfer el canvi";
  torna.onclick = () => cercar(entrada.paraula, PER_PARAULA);
  li.append(torna);
  $("llista-registre").prepend(li);
}

for (const simbol of SIMBOLS) {
  const boto = document.createElement("button");
  boto.type = "button";
  boto.textContent = simbol;
  boto.onmousedown = e => e.preventDefault();   // que el camp no perdi el focus
  boto.onclick = () => {
    if (!darrerCamp || !darrerCamp.isConnected) return;
    const { selectionStart: a, selectionEnd: b, value } = darrerCamp;
    darrerCamp.value = value.slice(0, a) + simbol + value.slice(b);
    darrerCamp.setSelectionRange(a + simbol.length, a + simbol.length);
    darrerCamp.focus();
    darrerCamp.dispatchEvent(new Event("input"));
  };
  $("simbols").append(boto);
}

$("cerca").addEventListener("submit", e => { e.preventDefault(); cercar($("text").value); });
$("cerca").addEventListener("change", refrescarFormulari);
// Els botons de símbols també serveixen per escriure la cerca per fonètica.
$("text").addEventListener("focus", () => darrerCamp = $("text"));

fetch("/api/configuracio").then(r => r.json()).then(dades => {
  config = dades;
  for (const codi of ORDRE.filter(codi => config.dialectes[codi])) {
    $("dialecte").append(new Option(config.dialectes[codi], codi));
  }
  const parametres = new URLSearchParams(location.search);
  const inicial = parametres.get("q");
  const mode = parametres.get("mode");
  const on = parametres.get("on");
  const dialecte = parametres.get("dialecte");
  if (inicial) cercar(inicial, {
    mode: NOMS_MODES[mode] ? mode : "exacta",
    on: INDICACIONS[on] ? on : "paraula",
    dialecte: config.dialectes[dialecte] ? dialecte : "",
  });
});
</script>
