    <!--
        Dades estructurades del lloc (schema.org, en JSON-LD).

        El WebSite lliga el domini amb un nom: sense això, els cercadors han
        d'endevinar com es diu el lloc a partir del <title> i del text, i
        acaben ensenyant el que volen. El nom és Rimador.cat; l'alternateName
        hi és perquè la gent ens anomena de maneres diferents (el Rimador, el
        Rimador català).

        El SearchAction declara que el cercador es pot obrir per URL amb ?q=.
        Això només és veritat perquè el js/script.js ho implementa (vegeu-hi
        cercarDesDeLaURL): si algun dia s'hi treu, aquest bloc s'ha de treure
        també, perquè declarar una cerca que no funciona és pitjor que no
        declarar-ne cap.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://rimador.cat/#lloc",
      "url": "https://rimador.cat/",
      "name": "Rimador.cat",
      "alternateName": ["El Rimador", "El Rimador català"],
      "description": "Diccionari de rimes en català: cerca rimes consonants i assonants segons la fonètica, amb filtres per categories gramaticals.",
      "inLanguage": "ca",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://rimador.cat/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="stylesheet" href="dist/css/styles.min.css?v=3b520f9">
    <link rel="stylesheet" href="avis/avis.css?v=3b520f9">
    <script src="dist/js/banner.min.js?v=3b520f9" defer></script>

    <script src="dist/js/menu.min.js?v=3b520f9" defer></script>
    <script src="avis/avis.js?v=3b520f9" defer></script>
    <script src="dist/js/script.min.js?v=3b520f9" defer></script>
</head>


<body id="principal">

    <div class="loader" id="loader">
        <!-- components.js -->
    </div>     

    <header id="header">
        <!-- components.js -->
    </header>

    <!-- La tira per triar el dialecte. Va aquí, entre la capçalera i la franja
         rosa, i no pas dins del .dropdown-container: el dialecte no és un
         criteri de cerca com les síl·labes o els plurals, sinó en quina mena
         de català es rima, i barrejar-lo amb els filtres el faria semblar una
         cosa que es pot deixar "indiferent".

         Els botons els enganxa el js/script.js (lligarTriaDeDialecte) i la
         tria es recorda entre visites. Es pot demanar per adreça amb ?d=ba, i
         en triar-ne un el codi queda a la barra perquè l'enllaç ensenyi a
         l'altre el mateix que veus tu. -->
    <div id="dialectes">
        <!-- components.js -->
    </div>

    <div id="separador_rosa1">
        <!-- components.js -->
    </div>


    <div class="container" id="container">

                 l'arc de Sant Martí i aquest ha de passar desapercebut. -->
            <a id="compartirButton" href="https://x.com/intent/post"

                <span>Piular</span>
